<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>M8 · Vintage & Streetwear</title>
    <meta name="description" content="Catálogo de streetwear y vintage M8 — Rosario, Santa Fe">
    <meta property="og:title" content="M8 — Catálogo Digital">
    <meta property="og:description" content="Catálogo de streetwear y vintage M8 — Rosario, Santa Fe">
    <meta property="og:image" content="https://m8vintage-catalogo.vercel.app/logo.png">
    <meta property="og:type" content="website">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #0B0B0B; }
      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }
      ::selection { background: #E3D0AC; color: #0B0B0B; }
      ::-webkit-scrollbar { width: 11px; height: 11px; }
      ::-webkit-scrollbar-track { background: #0B0B0B; }
      ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

      @keyframes m8rise { to { opacity: 1; transform: none; } }
      @keyframes m8marquee { to { transform: translateX(-50%); } }

      @media (prefers-reduced-motion: no-preference) {
        .m8-rise {
          opacity: 0;
          transform: translateY(18px);
          animation: m8rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .m8-marquee-track { animation: m8marquee 26s linear infinite; }
      }

      /* View Transitions — morph de producto (catálogo <-> detalle) */
      ::view-transition-group(*) {
        animation-duration: 0.5s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.4s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
