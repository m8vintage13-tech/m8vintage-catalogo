name: Supabase keep-alive

# Respaldo del cron de Vercel: hace una consulta real a la base cada 2 días
# para que el plan Free de Supabase no pause el proyecto (se pausa tras 7 días
# sin actividad). También se puede correr a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping directo a Supabase (lee 1 fila)
        env:
          # La publishable key es pública por diseño (ya viaja en el bundle del
          # sitio y está protegida por RLS), por eso puede vivir en el repo.
          SUPABASE_URL: https://krutcculfcdatuaxirru.supabase.co
          SUPABASE_KEY: sb_publishable_8COLpd1XcxpprVR3STrQ3Q_1KlF25Bf
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/productos?select=id&limit=1")
          echo "Supabase respondió HTTP $status"
          test "$status" = "200"

      - name: Ping a la función de Vercel (no bloquea si falla)
        continue-on-error: true
        run: curl -sf --retry 3 --retry-delay 5 https://m8vintage.vercel.app/api/keepalive
